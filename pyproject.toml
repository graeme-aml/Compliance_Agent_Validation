[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-agent-validation"
version = "0.1.0"
description = "Continuous validation framework for BSA/AML compliance AI agents"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "apscheduler>=3.10",
    "rich>=13.0",
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.scripts]
compliance-validate = "main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
